name: theme_builder
description: "TournaX Visual Template Builder - Enterprise Flutter Visual Editor"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  logger: ^2.4.0
  get_it: ^7.7.0
  uuid: ^4.5.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  vector_math: ^2.1.4
  flex_color_picker: ^3.6.0
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  image: ^4.2.0
  collection: ^1.19.0
  equatable: ^2.0.5
  flutter_animate: ^4.5.0
  reorderables: ^0.6.0
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
